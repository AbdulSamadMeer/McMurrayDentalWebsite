<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dental implant illustration</title>
  <desc id="desc">Stylized dental implant with crown over a soft gradient background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf4ff"/>
      <stop offset="100%" stop-color="#c8dbf2"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#edf2f8"/>
      <stop offset="100%" stop-color="#9aa8b8"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffef9"/>
      <stop offset="100%" stop-color="#f0e8de"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e3a5f" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="180" r="130" fill="#ffffff" opacity="0.25"/>
  <circle cx="200" cy="760" r="170" fill="#ffffff" opacity="0.18"/>

  <g transform="translate(800,445)" filter="url(#shadow)">
    <ellipse cx="0" cy="185" rx="240" ry="32" fill="#6d7c90" opacity="0.2"/>

    <path d="M-125 110 L-95 -180 L95 -180 L125 110 Z" fill="url(#metal)" stroke="#7d8c9e" stroke-width="4"/>
    <g stroke="#6f7f90" stroke-width="10" opacity="0.85">
      <line x1="-113" y1="-120" x2="113" y2="-84"/>
      <line x1="-118" y1="-70" x2="118" y2="-34"/>
      <line x1="-122" y1="-20" x2="122" y2="16"/>
      <line x1="-126" y1="30" x2="126" y2="66"/>
      <line x1="-129" y1="80" x2="129" y2="116"/>
    </g>

    <rect x="-85" y="-260" width="170" height="88" rx="24" fill="url(#metal)" stroke="#7d8c9e" stroke-width="4"/>

    <path d="M-150 -330 C-140 -390 140 -390 150 -330 L136 -242 C96 -208 -96 -208 -136 -242 Z" fill="url(#crown)" stroke="#d2c6b8" stroke-width="5"/>
    <path d="M-125 -302 C-112 -335 112 -335 125 -302" fill="none" stroke="#e2d7c8" stroke-width="7"/>
  </g>

  <text x="800" y="835" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="42" fill="#2b3e56" opacity="0.72">Dental Implant</text>
</svg>
